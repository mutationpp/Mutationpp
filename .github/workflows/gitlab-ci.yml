name: GitLab CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gitlab:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      GITLAB: https://gitlab.com/mutationpp/Mutationpp
      API: https://gitlab.com/api/v4/projects/mutationpp%2FMutationpp
      REF: ${{ github.head_ref || github.ref_name }}
      SHA: ${{ github.sha }}
    steps:
      - name: Wait for the mirror to carry this commit
        # The pull mirror catches up on GitLab's own interval, half an hour on gitlab.com,
        # and a pipeline triggered before it does would build the previous commit.
        run: |
          for _ in $(seq 1 60); do
            head=$(git ls-remote "$GITLAB.git" "refs/heads/$REF" | cut -f1)
            [ "$head" = "$SHA" ] && exit 0
            sleep 30
          done
          echo "the mirror is at ${head:-nothing} for $REF, not $SHA" >&2
          exit 1

      - name: Trigger the pipeline
        id: trigger
        env:
          TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          id=$(curl --fail-with-body -sS -X POST "$API/trigger/pipeline" \
            --data-urlencode "token=$TOKEN" --data-urlencode "ref=$REF" | jq -r .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "https://gitlab.com/mutationpp/Mutationpp/-/pipelines/$id" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the pipeline
        env:
          ID: ${{ steps.trigger.outputs.id }}
        run: |
          for _ in $(seq 1 60); do
            status=$(curl --fail-with-body -sS "$API/pipelines/$ID" | jq -r .status)
            case "$status" in
              success) exit 0 ;;
              failed|canceled|skipped)
                echo "pipeline $status" >&2
                exit 1 ;;
            esac
            sleep 30
          done
          echo "pipeline did not finish in 30 minutes" >&2
          exit 1
